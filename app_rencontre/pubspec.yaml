name: nocturne
description: "Nocturne - dating app for the alternative & goth community."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.1
  firebase_core: ^3.15.2
  flutter_card_swiper: ^3.0.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.0
  geolocator: ^12.0.0
  flutter_chat_ui: ^1.6.13
  flutter_chat_types: ^3.6.0
  flutter_dotenv: ^5.0.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  flutter_animate: ^4.5.0
  image_picker: ^1.1.2
  socket_io_client: ^2.0.3

  firebase_messaging: ^15.0.0
  record: ^6.0.0
  audioplayers: ^6.0.0
  path_provider: ^2.1.4
  local_auth: ^2.3.0
  screen_protector: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
